name: release-please

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main'
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: ${{ !cancelled() }}
        with:
          fetch-depth: 0

      - name: Verify publication and report back to the release PR
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha || github.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/release_notes.py publish "$RELEASE_SHA" "$RELEASE_TAG"

  preview:
    needs: release-please
    # Updates made by GITHUB_TOKEN need an explicit preview in this run. Edits
    # made by maintainers also refresh it through the release PR event.
    if: >-
      ${{ !cancelled() &&
          (needs.release-please.outputs.pr ||
           (github.event_name == 'pull_request_target' &&
            github.event.pull_request.user.login == 'github-actions[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.head.ref == 'release-please--branches--main--components--promptfoo-action')) }}
    concurrency:
      group: release-notes-preview-${{ github.event.pull_request.number || fromJSON(needs.release-please.outputs.pr || '{}').number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Execute only the base revision's helper. It reads the PR's changelog
      # and version as Git blobs, never as executable source.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Render the exact proposed changelog section on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || fromJSON(needs.release-please.outputs.pr || '{}').number }}
        run: python3 .github/scripts/release_notes.py preview "$PR_NUMBER"
